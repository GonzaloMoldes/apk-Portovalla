name: APK Visitas Leads

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Etiqueta con el número relleno de ceros (vl-0011) para que GitHub ordene bien
      # las versiones: como texto "1.0.9" iría por delante de "1.0.10".
      - name: Número de versión
        run: echo "BUILD=$(printf '%04d' "$GITHUB_RUN_NUMBER")" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/VisitasLeads-1.0.${VERSION_CODE}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: VisitasLeads-1.0.${{ github.run_number }}
          path: dist/*.apk

      - name: Publicar descarga (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vl-${{ env.BUILD }}
          name: Visitas Leads 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          body: |
            APK de la app Visitas Leads.
            Descarga el fichero `.apk` desde la tablet e instálalo (permite "instalar apps desconocidas" para el navegador).
            Se instala encima de la versión anterior sin perder los datos.
          files: dist/*.apk
